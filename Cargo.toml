[package]
name = "codex-claude-setup"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "generate-marketplaces"
path = "src/bin/generate-marketplaces.rs"

[[bin]]
name = "generate-model-catalog"
path = "src/bin/generate-model-catalog.rs"

[[bin]]
name = "codex-history-sync"
path = "src/bin/codex-history-sync.rs"

[[bin]]
name = "plugin-defaults"
path = "src/bin/plugin-defaults.rs"

[[bin]]
name = "codex-reserve-policy"
path = "src/bin/codex-reserve-policy.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.9.11", default-features = false, features = ["parse", "std", "serde"] }
