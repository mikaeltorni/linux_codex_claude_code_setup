<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Linux Codex and Claude Code Setup</title>
  <desc id="description">Social preview for a Linux CLI installer with Codex source selection, separate accounts, and plugin setup.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828" />
      <stop offset="1" stop-color="#192c3d" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.42" />
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#background)" />
  <circle cx="1060" cy="100" r="230" fill="#22d3ee" opacity="0.08" />
  <circle cx="180" cy="590" r="220" fill="#8b5cf6" opacity="0.10" />
  <path d="M 0 496 C 230 420, 370 680, 660 570 S 1080 480, 1280 550" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.27" />
  <rect x="76" y="68" width="8" height="504" rx="4" fill="url(#accent)" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="120" y="142" fill="#a5f3fc" font-size="23" font-weight="700" letter-spacing="3">LINUX CLI INSTALLER</text>
    <text x="116" y="232" fill="#f8fafc" font-size="62" font-weight="700">Linux Codex and</text>
    <text x="116" y="306" fill="#f8fafc" font-size="62" font-weight="700">Claude Code Setup</text>
    <text x="120" y="364" fill="#cbd5e1" font-size="25">Separate accounts. Selectable Codex sources.</text>
    <text x="120" y="401" fill="#cbd5e1" font-size="25">Programming-prompts plugins and optional CLIs.</text>
    <rect x="120" y="449" width="500" height="54" rx="27" fill="#ffffff" opacity="0.08" stroke="#64748b" stroke-opacity="0.52" />
    <text x="145" y="483" fill="#e2e8f0" font-size="19" font-weight="600">Claude Code · Codex · Cline · Grok · opencode</text>
    <text x="120" y="550" fill="#94a3b8" font-size="18">mikaeltorni/linux_codex_claude_code_setup</text>
  </g>
  <g filter="url(#shadow)" font-family="monospace">
    <rect x="744" y="146" width="460" height="330" rx="22" fill="#0b1220" stroke="#475569" stroke-width="2" />
    <path d="M 744 178 Q 744 146 776 146 H 1172 Q 1204 146 1204 178 V 198 H 744 Z" fill="#1e293b" />
    <circle cx="779" cy="172" r="7" fill="#fb7185" />
    <circle cx="805" cy="172" r="7" fill="#fbbf24" />
    <circle cx="831" cy="172" r="7" fill="#34d399" />
    <text x="874" y="178" fill="#94a3b8" font-size="14">linux-cli-setup</text>
    <text x="778" y="252" fill="#67e8f9" font-size="18">$ bash install.sh --barebones</text>
    <text x="778" y="298" fill="#c4b5fd" font-size="18">$ codex --version</text>
    <text x="804" y="326" fill="#e2e8f0" font-size="17">codex-cli</text>
    <text x="778" y="374" fill="#c4b5fd" font-size="18">$ claude --version</text>
    <text x="804" y="402" fill="#e2e8f0" font-size="17">Claude Code</text>
    <rect x="778" y="430" width="128" height="5" rx="2.5" fill="url(#accent)" />
    <text x="927" y="438" fill="#64748b" font-size="13">USER-LOCAL COMMANDS</text>
  </g>
</svg>
